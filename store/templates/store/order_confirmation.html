<!DOCTYPE html>
<html>
<head>
  <title>Order Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: #232f3e;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav a {
      color: white;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    .main {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .confirmation-box {
      background-color: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .confirmation-box h2 {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 1rem;
    }

    .confirmation-box p {
      color: #555;
      margin-bottom: 2rem;
    }

    .back-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .footer {
      background-color: #eaeaea;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Juvenile Corner</div>
    <nav class="nav">
      <a href="{% url 'product_list' %}">Home</a>
      <a href="#">Categories</a>
    </nav>
  </header>

  <main class="main">
    <div class="confirmation-box">
      <h2>Thank you for your order!</h2>
      <p>Your order has been received and is being processed.</p>
      <a href="{% url 'product_list' %}" class="back-btn">Back to Shop</a>
    </div>
  </main>

  <footer class="footer">
    © 2025 Juvenile Corner. All rights reserved.
  </footer>
</body>
</html>
