<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: #232f3e;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav a {
      color: white;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    .main {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .checkout-box {
      background-color: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }

    .checkout-box h2 {
      margin-top: 0;
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 1rem;
    }

    .checkout-box .total {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .checkout-box label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      font-weight: 500;
      color: #333;
    }

    .checkout-box input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .checkout-box button {
      margin-top: 2rem;
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .footer {
      background-color: #eaeaea;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Juvenile Corner</div>
    <nav class="nav">
      <a href="{% url 'product_list' %}">Home</a>
      <a href="#">Categories</a>
    </nav>
  </header>

  <main class="main">
    <div class="checkout-box">
      <h2>Checkout</h2>
      <div class="total">Total: R{{ total }}</div>

      <form method="POST">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" name="name" required>

        <label for="email">Email:</label>
        <input type="email" name="email" required>

        <label for="address">Address:</label>
        <input type="text" name="address" required>

        <button type="submit">Place Order</button>
<script src="https://js.yoco.com/sdk/v1/yoco-sdk.js"></script>
<script>
  var yoco = new YocoSDK({
    publicKey: 'your-public-key-here'
  });

  function payWithYoco() {
    yoco.showPopup({
      amountInCents: 5000, // R50.00
      currency: 'ZAR',
      callback: function(result) {
        if (result.error) {
          alert("Payment failed: " + result.error.message);
        } else {
          fetch('/yoco-payment/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-CSRFToken': '{{ csrf_token }}'
            },
            body: 'token=' + result.id + '&amount=5000'
          }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
              window.location.href = '/order-confirmation/';
            }
          });
        }
      }
    });
  }
</script>

<button onclick="payWithYoco()">Pay with Card</button>      
       </form>
    </div>
  </main>

  <footer class="footer">
    © 2025 Juvenile Corner. All rights reserved.
  </footer>
</body>
</html>
